<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Girasoles</title>
<meta name="description" content="Un campo de girasoles animado, en homenaje a los que aman la luz.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#141031;
    --sky-mid:#5a2f63;
    --sky-warm:#c9527a;
    --sky-horizon:#f2955a;
    --sun-glow:#ffd76a;
    --hill-1:#241a3c;
    --hill-2:#150f28;
    --hill-3:#0a0714;
    --petal-a:#ffdd55;
    --petal-b:#e8871e;
    --center-a:#5a3418;
    --center-b:#2a170a;
    --stem-a:#5f9153;
    --stem-b:#2e5a2c;
    --vh: 1vh;
  }

  *,*::before,*::after{ margin:0; padding:0; box-sizing:border-box; }

  html,body{
    width:100%;
    height:100%;
    background:#0a0714;
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
  }

  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    position:relative;
    height:calc(var(--vh, 1vh) * 100);
    touch-action:manipulation;
  }

  /* ---------- ESCENA ---------- */
  .scene{
    position:absolute;
    inset:0;
    overflow:hidden;
  }

  .sky{
    position:absolute;
    inset:0;
    background:
      radial-gradient(120% 65% at 50% 100%, var(--sky-horizon) 0%, transparent 60%),
      linear-gradient(to bottom,
        var(--sky-top) 0%,
        var(--sky-mid) 45%,
        var(--sky-warm) 72%,
        var(--sky-horizon) 100%);
  }

  .stars{
    position:absolute;
    inset:0;
    width:100%;
    height:70%;
  }
  .star{
    position:absolute;
    width:2px;
    height:2px;
    border-radius:50%;
    background:#fff;
    opacity:0;
    animation:twinkle 4s ease-in-out infinite;
    will-change:opacity;
  }
  @keyframes twinkle{
    0%,100%{ opacity:0; }
    50%{ opacity:var(--star-o,.8); }
  }

  .sun{
    position:absolute;
    left:50%;
    top:42%;
    width:min(38vw,220px);
    height:min(38vw,220px);
    border-radius:50%;
    background:radial-gradient(circle at 45% 40%, #fff6d8 0%, var(--sun-glow) 35%, rgba(255,183,3,.35) 60%, transparent 72%);
    filter:blur(1px);
    transform:translate(-50%, 60%);
    animation:sunDrift 60s ease-in-out infinite;
    mix-blend-mode:screen;
    will-change:transform;
  }
  /* Antes esta animación tocaba "top" (layout) en cada frame; ahora todo el
     recorrido es transform, así que el navegador lo resuelve en el compositor
     sin recalcular el layout ni repintar el resto de la escena. */
  @keyframes sunDrift{
    0%,100%{ transform:translate(-58%,4vh) scale(1); }
    50%{ transform:translate(-42%,-4vh) scale(1.06); }
  }

  .hill{
    position:absolute;
    left:0;
    width:100%;
    bottom:0;
  }
  .hill svg{ display:block; width:100%; height:auto; }
  .hill--1{ z-index:2; opacity:.9; }
  .hill--2{ z-index:1; opacity:.95; }
  .hill--3{ z-index:0; }

  .pollen{
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:6;
  }
  .mote{
    position:absolute;
    bottom:-4%;
    width:5px;
    height:5px;
    border-radius:50%;
    background:radial-gradient(circle, #fff3c4 0%, rgba(255,214,102,.6) 55%, transparent 75%);
    animation:rise linear infinite;
    opacity:0;
    will-change:transform,opacity;
  }
  @keyframes rise{
    0%{ opacity:0; transform:translate(0,0); }
    8%{ opacity:.85; }
    92%{ opacity:.5; }
    100%{ opacity:0; transform:translate(var(--drift,20px), -115vh); }
  }

  /* ---------- CAMPO DE GIRASOLES ---------- */
  .field{
    position:absolute;
    inset:0;
    z-index:3;
  }

  .flower{
    position:absolute;
    bottom:0;
    display:block;
    height:var(--h, 42vh);
    width:auto;
    transform-origin:50% 100%;
    transform:translateX(-50%) scaleY(0);
    animation:
      grow 1.6s cubic-bezier(.34,1.56,.64,1) forwards,
      sway var(--sway-dur,8s) ease-in-out infinite;
    animation-delay:var(--grow-delay,0s), calc(var(--grow-delay,0s) + 1.6s);
    will-change:transform;
    filter:
      hue-rotate(var(--hue,0deg))
      saturate(var(--sat,1))
      brightness(var(--bri,1))
      drop-shadow(0 6px 10px rgba(0,0,0,.35));
  }

  @keyframes grow{
    0%{ transform:translateX(-50%) scaleY(0); }
    60%{ transform:translateX(-50%) scaleY(1.04); }
    100%{ transform:translateX(-50%) scaleY(1); }
  }

  @keyframes sway{
    0%,100%{ rotate:calc(-1deg * var(--sway-amt,3)); }
    50%{ rotate:calc(1deg * var(--sway-amt,3)); }
  }

  .flower .head{
    transform-origin:50% 100%;
    transform-box:fill-box;
    animation:track var(--track-dur,60s) ease-in-out infinite;
    will-change:transform;
  }
  @keyframes track{
    0%{ transform:rotate(-4deg); }
    50%{ transform:rotate(5deg); }
    100%{ transform:rotate(-4deg); }
  }

  @media (prefers-reduced-motion: reduce){
    .flower{ animation:grow .01s forwards; will-change:auto; }
    .flower .head{ animation:none; will-change:auto; }
    .sun{ animation:none; top:42%; transform:translate(-50%,0); will-change:auto; }
    .mote{ animation:none; opacity:0; will-change:auto; }
    .star{ animation:none; opacity:.6; will-change:auto; }
    .hero-text{ animation:none; opacity:1; transform:translate(-50%,-50%); }
  }

  /* ---------- RESPONSIVE ---------- */
  @media (max-width:600px){
    .sun{ width:52vw; height:52vw; }
  }

  /* ---------- TEXTO CENTRAL ---------- */
  .hero-text{
    position:absolute;
    left:50%;
    top:27%;
    transform:translate(-50%,-50%);
    z-index:5;
    width:min(86%, 620px);
    text-align:center;
    pointer-events:none;
    font-family:'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    font-style:italic;
    font-weight:500;
    font-size:clamp(1.05rem, 3.4vw, 1.7rem);
    letter-spacing:.03em;
    line-height:1.5;
    color:rgba(255,244,222,.82);
    text-shadow:0 0 18px rgba(255,205,110,.35), 0 2px 10px rgba(0,0,0,.25);
    opacity:0;
    animation:heroIn 2.4s ease-out 2.6s forwards, heroFloat 9s ease-in-out 5s infinite;
  }
  .hero-text::before,
  .hero-text::after{
    content:'';
    display:block;
    width:34px;
    height:1px;
    margin:.55em auto;
    background:linear-gradient(90deg, transparent, rgba(255,221,150,.55), transparent);
  }
  @keyframes heroIn{
    0%{ opacity:0; transform:translate(-50%,-42%); }
    100%{ opacity:1; transform:translate(-50%,-50%); }
  }
  @keyframes heroFloat{
    0%,100%{ transform:translate(-50%,-50%); }
    50%{ transform:translate(-50%, calc(-50% - 6px)); }
  }
  @media (max-width:480px){
    .hero-text{ top:24%; }
  }

  .credit{
    position:absolute;
    bottom:10px;
    right:14px;
    z-index:8;
    font-size:.65rem;
    letter-spacing:.06em;
    color:rgba(255, 255, 255, 0.087);
    font-weight:500;
    pointer-events:none;
  }
</style>
</head>
<body>

<div class="scene">
  <div class="sky"></div>
  <div class="stars" id="stars"></div>
  <div class="sun"></div>
  <p class="hero-text">Se que no puedo darte las flores en fisico, pero espero puedas disfrutar estas, te quiero muchisimo, descansa✨</p>

  <div class="hill hill--3">
    <svg viewBox="0 0 400 90" preserveAspectRatio="none"><path d="M0,90 L0,55 Q80,15 160,40 T320,30 Q370,20 400,45 L400,90 Z" fill="var(--hill-3)"/></svg>
  </div>
  <div class="hill hill--2">
    <svg viewBox="0 0 400 70" preserveAspectRatio="none"><path d="M0,70 L0,38 Q100,8 210,30 T400,20 L400,70 Z" fill="var(--hill-2)"/></svg>
  </div>
  <div class="hill hill--1">
    <svg viewBox="0 0 400 50" preserveAspectRatio="none"><path d="M0,50 L0,26 Q120,2 230,18 T400,10 L400,50 Z" fill="var(--hill-1)"/></svg>
  </div>

  <div class="field" id="field"></div>
  <div class="pollen" id="pollen"></div>
</div>

<div class="credit">❤️ Jijijij</div>

<!-- Plantilla de un girasol: se clona por cada instancia en JS (evita depender      -->
<!-- de que el CSS atraviese el árbol de instancias de <use>, que no es fiable).     -->
<template id="flowerTemplate"><svg xmlns="http://www.w3.org/2000/svg">
  <g class="stem-group">
    <path d="M0,26 C-10,90 8,170 -3,270" fill="none" stroke="url(#stemGrad)" stroke-width="9" stroke-linecap="round"></path>
    <use href="#leaf" transform="translate(-2,110) rotate(-18) scale(-1,1) translate(-6,0)" opacity=".95"></use>
    <use href="#leaf" transform="translate(2,175) rotate(24)" opacity=".95"></use>

    <g class="head">
      <g class="petals">
        <use href="#petal" transform="rotate(0) translate(0,-23)"></use>
        <use href="#petal" transform="rotate(20) translate(0,-23)"></use>
        <use href="#petal" transform="rotate(40) translate(0,-23)"></use>
        <use href="#petal" transform="rotate(60) translate(0,-23)"></use>
        <use href="#petal" transform="rotate(80) translate(0,-23)"></use>
        <use href="#petal" transform="rotate(100) translate(0,-23)"></use>
        <use href="#petal" transform="rotate(120) translate(0,-23)"></use>
        <use href="#petal" transform="rotate(140) translate(0,-23)"></use>
        <use href="#petal" transform="rotate(160) translate(0,-23)"></use>
        <use href="#petal" transform="rotate(180) translate(0,-23)"></use>
        <use href="#petal" transform="rotate(200) translate(0,-23)"></use>
        <use href="#petal" transform="rotate(220) translate(0,-23)"></use>
        <use href="#petal" transform="rotate(240) translate(0,-23)"></use>
        <use href="#petal" transform="rotate(260) translate(0,-23)"></use>
        <use href="#petal" transform="rotate(280) translate(0,-23)"></use>
        <use href="#petal" transform="rotate(300) translate(0,-23)"></use>
        <use href="#petal" transform="rotate(320) translate(0,-23)"></use>
        <use href="#petal" transform="rotate(340) translate(0,-23)"></use>
      </g>
      <circle r="25" fill="url(#centerGrad)"></circle>
      <use href="#seedPattern"></use>
      <circle r="25" fill="none" stroke="rgba(0,0,0,.25)" stroke-width="1"></circle>
    </g>
  </g>
</svg></template>

<script>
(function(){
  // Altura real del viewport en móviles (evita saltos por la barra de direcciones)
  function setVh(){
    document.documentElement.style.setProperty('--vh', (window.innerHeight * 0.01) + 'px');
  }
  setVh();
  window.addEventListener('resize', debounce(setVh, 150));
  window.addEventListener('orientationchange', setVh);

  function debounce(fn, wait){
    let t;
    return function(){ clearTimeout(t); t = setTimeout(fn, wait); };
  }

  const field = document.getElementById('field');
  const pollenBox = document.getElementById('pollen');
  const starsBox = document.getElementById('stars');
  const flowerTemplate = document.getElementById('flowerTemplate');
  const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function rand(min, max){ return Math.random() * (max - min) + min; }
  function pick(arr){ return arr[Math.floor(Math.random() * arr.length)]; }

  /* ----- Estrellas ----- */
  function buildStars(){
    starsBox.innerHTML = '';
    const count = window.innerWidth < 600 ? 22 : 40;
    const frag = document.createDocumentFragment();
    for(let i=0;i<count;i++){
      const s = document.createElement('div');
      s.className = 'star';
      s.style.left = rand(0,100) + '%';
      s.style.top = rand(0,60) + '%';
      s.style.setProperty('--star-o', rand(.3,.9).toFixed(2));
      s.style.animationDuration = rand(2.5,5.5).toFixed(2) + 's';
      s.style.animationDelay = rand(0,4).toFixed(2) + 's';
      frag.appendChild(s);
    }
    starsBox.appendChild(frag);
  }

  /* ----- Polen / luciérnagas ----- */
  function buildPollen(){
    pollenBox.innerHTML = '';
    if(prefersReduced) return;
    const count = window.innerWidth < 600 ? 10 : 20;
    const frag = document.createDocumentFragment();
    for(let i=0;i<count;i++){
      const m = document.createElement('div');
      m.className = 'mote';
      m.style.left = rand(0,100) + '%';
      m.style.setProperty('--drift', rand(-40,40).toFixed(0) + 'px');
      m.style.animationDuration = rand(9,18).toFixed(2) + 's';
      m.style.animationDelay = rand(0,14).toFixed(2) + 's';
      frag.appendChild(m);
    }
    pollenBox.appendChild(frag);
  }

  /* ----- Campo de girasoles ----- */
  function buildField(){
    field.innerHTML = '';
    const w = window.innerWidth;
    const count = w < 480 ? 7 : w < 900 ? 11 : 15;
    const frag = document.createDocumentFragment();

    // Capa de fondo (más pequeños, más oscuros, detrás)
    const layers = [
      { n: Math.ceil(count*0.35), hMin:22, hMax:30, briMin:.72, briMax:.85, z:1, swayMin:6, swayMax:8, ampMin:2, ampMax:3 },
      { n: Math.ceil(count*0.35), hMin:30, hMax:40, briMin:.85, briMax:.98, z:2, swayMin:6.5,swayMax:9, ampMin:2.5,ampMax:3.5 },
      { n: count - Math.ceil(count*0.35)*2, hMin:40, hMax:54, briMin:.98,briMax:1.08, z:3, swayMin:7, swayMax:10, ampMin:3, ampMax:4.5 },
    ];

    // Mezclamos las posiciones horizontales para que las flores pequeñas (fondo)
    // y grandes (frente) se repartan por todo el ancho, no por bloques.
    const slots = Array.from({length: count}, (_, i) => i);
    for(let i = slots.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [slots[i], slots[j]] = [slots[j], slots[i]];
    }
    let slotPointer = 0;
    let globalIndex = 0;

    layers.forEach(layer => {
      for(let i=0;i<layer.n;i++){
        const svgNS = 'http://www.w3.org/2000/svg';
        const svg = document.createElementNS(svgNS, 'svg');
        svg.setAttribute('viewBox', '-120 -100 240 400');
        svg.setAttribute('class', 'flower');
        svg.setAttribute('aria-hidden', 'true');
        const clone = flowerTemplate.content.cloneNode(true);
        const stemGroup = clone.querySelector('.stem-group');
        svg.appendChild(stemGroup);

        const slot = slots[slotPointer++];
        const left = ((slot + rand(.08,.92)) / count) * 100;
        const h = rand(layer.hMin, layer.hMax);
        const bri = rand(layer.briMin, layer.briMax);
        const hue = rand(-6,6);
        const sat = rand(.9,1.15);
        const delay = rand(0, 1.1) + (globalIndex * 0.06);
        const swayDur = rand(layer.swayMin, layer.swayMax);
        const swayAmt = rand(layer.ampMin, layer.ampMax);
        const trackDur = rand(46,74);

        svg.style.setProperty('--h', h + 'vh');
        svg.style.setProperty('--bri', bri.toFixed(2));
        svg.style.setProperty('--hue', hue.toFixed(1) + 'deg');
        svg.style.setProperty('--sat', sat.toFixed(2));
        svg.style.setProperty('--grow-delay', delay.toFixed(2) + 's');
        svg.style.setProperty('--sway-dur', swayDur.toFixed(2) + 's');
        svg.style.setProperty('--sway-amt', swayAmt.toFixed(2));
        svg.style.setProperty('--track-dur', trackDur.toFixed(1) + 's');
        svg.style.left = left.toFixed(2) + '%';
        svg.style.zIndex = layer.z;

        if(prefersReduced){
          svg.style.animation = 'none';
          svg.style.transform = 'translateX(-50%) scaleY(1)';
        }

        frag.appendChild(svg);
        globalIndex++;
      }
    });

    field.appendChild(frag);
  }

  function buildAll(){
    buildStars();
    buildPollen();
    buildField();
  }

  buildAll();
  window.addEventListener('resize', debounce(buildAll, 250));
})();
</script>
</body>
</html>
